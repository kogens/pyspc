[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spcpy"
version = "0.1.0"
description = "GRAMS SPC file reader for Python"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["spcpy"]

[tool.ruff]
line-length = 120
